[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "baseweb-demo"
version = "0.5.0"
description = "Demonstration application for baseweb"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
  {name = "Christophe VG", email = "contact@christophe.vg"}
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Web Environment",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
keywords = ["baseweb", "quart", "demo", "oauth"]

dependencies = [
  "baseweb>=0.6.0",
  "oatk[quart]>=0.2.1",
  "python-dotenv",
  "gunicorn>=21.0.0",
  "uvicorn[standard]>=0.24.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
  "pytest-cov>=5.0.0",
  "mypy>=1.13.0",
  "ruff>=0.8.0",
]

[project.urls]
Homepage = "https://github.com/christophevg/baseweb-demo"
Repository = "https://github.com/christophevg/baseweb-demo"
Issues = "https://github.com/christophevg/baseweb-demo/issues"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"
indent-width = 2

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort
  "B",   # flake8-bugbear
  "C4",  # flake8-comprehensions
  "UP",  # pyupgrade
]
ignore = [
  "E501",  # line too long (handled by formatter)
  "E402",  # module level import not at top (intentional for route registration)
  "F401",  # unused import (intentional side-effect imports for route registration)
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"